[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teluvane"
version = "0.1.0"
description = "AI-agent accountability and compliance auditing tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Emir Sakarya" }]
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.1",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "slowapi>=0.1.9",
    "weasyprint>=62.0",
    "mcp>=1.2,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
teluvane-mcp = "teluvane.mcp_server:main"

[project.urls]
Homepage = "https://github.com/iWeslax83/teluvane"
Repository = "https://github.com/iWeslax83/teluvane"

[tool.setuptools.packages.find]
include = ["teluvane*"]
exclude = ["tests*"]
